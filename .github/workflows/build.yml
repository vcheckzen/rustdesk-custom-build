name: Build custom RustDesk (Windows + Android)

on:
  workflow_dispatch:
    inputs:
      id_server:
        description: "ID/rendezvous server, host[:port]. Empty = use secret RD_ID_SERVER or placeholder."
        required: false
        default: ""
      relay_server:
        description: "Relay server, host[:port]. Empty = use secret RD_RELAY_SERVER or none."
        required: false
        default: ""
      api_server:
        description: "API server URL, https://host. Empty = use secret RD_API_SERVER or site domain."
        required: false
        default: ""
      pub_key:
        description: "hbbs public key. Empty = use secret RD_PUB_KEY."
        required: false
        default: ""
      app_id:
        description: "Android applicationId. Empty = im.logi.rd."
        required: false
        default: ""
      app_name:
        description: "Display name. Empty = 远程协助."
        required: false
        default: ""
      site_domain:
        description: "Domain that replaces rustdesk.com everywhere. Empty = secret RD_SITE_DOMAIN or rd.example.com."
        required: false
        default: ""
      publish_release:
        description: "Publish the build at all. Goes to ARTIFACTS_REPO (private) if set, else an encrypted or plain artifact."
        type: boolean
        required: false
        default: true
      allow_parallel:
        description: "Keep other in-flight runs alive. Off = a new run cancels the previous one on the same branch."
        type: boolean
        required: false
        default: false
  push:
    branches: [main, master]

# One build per branch: a new push cancels the stale run instead of burning a second
# set of runners. Tick `allow_parallel` on a manual run to deliberately build side by side.
concurrency:
  group: build-${{ github.ref }}-${{ inputs.allow_parallel && github.run_id || 'single' }}
  cancel-in-progress: ${{ !inputs.allow_parallel }}

# Least privilege by default, and nothing here ever elevates: builds are never written back to
# this repo. See the ARTIFACTS_* env block for where they go instead.
permissions:
  contents: read

env:
  # Pinned upstream. Bump this (and re-check `patches/apply.py` anchors) to upgrade.
  UPSTREAM_REPO: alonginwind/rustdesk
  UPSTREAM_SHA: cd3151f84bc322da889a6973363f2acd3af6d1c9
  VERSION: "1.5.3"

  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

  # Windows runners default to cp1252; the patcher prints a non-ASCII app name.
  PYTHONIOENCODING: "utf-8"

  # ---------------------------------------------------------------------------------------
  # Where build output goes. GitHub has no per-user ACL on workflow artifacts: the docs say
  # "People who are signed into GitHub and have read access to a repository can download
  # workflow artifacts", and on a PUBLIC repo read access means everyone. So artifacts cannot
  # be made private in place. Two supported ways to keep them to yourself:
  #
  #   1. ARTIFACTS_REPO  = "you/rustdesk-artifacts" (a PRIVATE repo)  + ARTIFACTS_TOKEN
  #      A PAT with Contents: read+write on that repo. Builds land there as release assets.
  #      Truly access-controlled: only accounts with read access can download.
  #   2. ARTIFACTS_PASSPHRASE = a long random string (used when ARTIFACTS_REPO is unset)
  #      The artifact is uploaded to this repo but AES-256 encrypted first. Anyone can
  #      download the blob; only you can open it.
  #
  # If neither is set the build is uploaded in the clear, downloadable by any GitHub account,
  # and kept for one day only.
  # ---------------------------------------------------------------------------------------
  ARTIFACTS_REPO: ${{ secrets.ARTIFACTS_REPO || vars.ARTIFACTS_REPO || '' }}
  ARTIFACTS_PASSPHRASE: ${{ secrets.ARTIFACTS_PASSPHRASE || vars.ARTIFACTS_PASSPHRASE || '' }}

  # Build configuration: dispatch input > repository secret > repository variable > placeholder.
  # Nothing here is committed; the repo only ever contains placeholders.
  RD_APP_ID: ${{ inputs.app_id || secrets.RD_APP_ID || vars.RD_APP_ID || '' }}
  RD_APP_NAME: ${{ inputs.app_name || secrets.RD_APP_NAME || vars.RD_APP_NAME || '' }}
  RD_ID_SERVER: ${{ inputs.id_server || secrets.RD_ID_SERVER || vars.RD_ID_SERVER || '' }}
  RD_RELAY_SERVER: ${{ inputs.relay_server || secrets.RD_RELAY_SERVER || vars.RD_RELAY_SERVER || '' }}
  RD_API_SERVER: ${{ inputs.api_server || secrets.RD_API_SERVER || vars.RD_API_SERVER || '' }}
  RD_PUB_KEY: ${{ inputs.pub_key || secrets.RD_PUB_KEY || vars.RD_PUB_KEY || '' }}
  RD_SITE_DOMAIN: ${{ inputs.site_domain || secrets.RD_SITE_DOMAIN || vars.RD_SITE_DOMAIN || '' }}


jobs:
  # ---------------------------------------------------------------------------------------
  android:
    name: Android (arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Secret hygiene check
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '(^|/)ght\.txt$|ARTIFACTS_PASSPHRASE|\.passphrase$|\.keystore$|\.jks$|keystore\.env$|(^|/)key\.properties$' || true)
          if [ -n "$bad" ]; then
            echo "::error::secret material is tracked in this repo: $bad"
            exit 1
          fi
          echo "no secret files tracked"

          # Report where this build will go, at minute one rather than after a 40-minute build.
          # Only the mode is printed, never a value.
          if [ -n "${ARTIFACTS_REPO:-}" ]; then
            echo "publish mode: private artifacts repo"
          elif [ -n "${ARTIFACTS_PASSPHRASE:-}" ]; then
            echo "publish mode: AES-256 encrypted workflow artifact"
          else
            echo "::warning::publish mode: PLAIN public artifact (set ARTIFACTS_REPO or ARTIFACTS_PASSPHRASE)"
          fi

      - name: Checkout upstream RustDesk
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: src
          submodules: recursive

      - name: Apply patches
        run: python3 patches/apply.py src

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libasound2-dev libc6-dev libclang-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch Flutter (dropdown filter)
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "$GITHUB_WORKSPACE/src/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: android-arm64
          workspaces: src -> target

      - name: Build native dependencies
        working-directory: src
        run: ./flutter/build_android_deps.sh arm64-v8a

      - name: Generate flutter-rust-bridge
        uses: ./.github/actions/gen-bridge

      - name: Build liblibrustdesk.so
        working-directory: src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          # Rust links the C++ runtime dynamically on Android; without this the APK builds
          # but dies at startup with "library libc++_shared.so not found".
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Configure Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: src
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > flutter/android/app/key.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=key.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > flutter/android/key.properties
            echo "release signing configured"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set, falling back to debug signing"
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" flutter/android/app/build.gradle
          fi

      - name: Build APK
        # `flutter build apk` resolves pubspec.yaml from the CWD, and the Flutter project lives
        # in src/flutter, not in src. Running it from src fails with "No pubspec.yaml file found".
        working-directory: src/flutter
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/java-17-openjdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version 2>&1 | head -1

          # The default 1 GB Gradle heap is not enough for the release R8 pass.
          if grep -q '^org.gradle.jvmargs=' ./android/gradle.properties; then
            sed -i -E 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx2g|' ./android/gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx2g' >> ./android/gradle.properties
          fi

          flutter build apk --release --target-platform android-arm64 --split-per-abi
          cp ./build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "$GITHUB_WORKSPACE/rustdesk-${{ env.VERSION }}-arm64-v8a.apk"

      - name: Verify APK identity
        run: |
          set -euo pipefail
          APK="rustdesk-${{ env.VERSION }}-arm64-v8a.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::warning::aapt2 not found, skipping package-name check"
            exit 0
          fi
          "$AAPT" dump packagename "$APK"
          "$AAPT" dump packagename "$APK" | grep -qx "im.logi.rd"
          echo "package name verified: im.logi.rd"

      # Tier 1: private companion repo (recommended, truly access-controlled).
      - name: Publish APK to private artifacts repo
        if: ${{ inputs.publish_release != false && env.ARTIFACTS_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ARTIFACTS_REPO is set but ARTIFACTS_TOKEN is empty, so nothing can be published. Add a PAT with Contents: read+write on $ARTIFACTS_REPO."
            exit 1
          fi
          TAG="build-${{ github.run_number }}"
          gh release view "$TAG" --repo "$ARTIFACTS_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$ARTIFACTS_REPO" \
                 --title "RustDesk custom build #${{ github.run_number }}" \
                 --notes "source ${{ github.repository }}@${{ github.sha }}" || true
          gh release upload "$TAG" "rustdesk-${{ env.VERSION }}-arm64-v8a.apk" \
            --repo "$ARTIFACTS_REPO" --clobber
          echo "published to https://github.com/$ARTIFACTS_REPO/releases/tag/$TAG"

      # Tier 2/3: no private repo, so it has to live in this repo's artifact storage.
      # Encrypted when ARTIFACTS_PASSPHRASE is set, otherwise plain and public.
      - name: Prepare workflow artifact
        id: artifact
        if: ${{ inputs.publish_release != false && env.ARTIFACTS_REPO == '' }}
        run: |
          set -euo pipefail
          F="rustdesk-${{ env.VERSION }}-arm64-v8a.apk"
          if [ -n "${ARTIFACTS_PASSPHRASE:-}" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -md sha256 -salt -in "$F" -out "$F.enc" -pass env:ARTIFACTS_PASSPHRASE
            echo "path=$F.enc" >> "$GITHUB_OUTPUT"
            echo "::notice::Encrypted with AES-256. Decrypt with: openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -in $F.enc -out $F"
          else
            echo "path=$F" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither ARTIFACTS_REPO nor ARTIFACTS_PASSPHRASE is set, so this APK is downloadable by anyone with a GitHub account. It will be deleted after 1 day."
          fi

      - name: Upload workflow artifact
        if: ${{ inputs.publish_release != false && env.ARTIFACTS_REPO == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          # Encrypted blobs are safe to keep longer than plaintext ones.
          retention-days: ${{ env.ARTIFACTS_PASSPHRASE != '' && 3 || 1 }}

  # ---------------------------------------------------------------------------------------
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    env:
      # vcpkg binary caching through the Actions cache. Without it ffmpeg / libvpx / opus /
      # aom / libyuv / mfx-dispatch are all compiled from source, which is hours on a 2-core
      # runner. The x-gha provider needs ACTIONS_CACHE_URL + ACTIONS_RUNTIME_TOKEN, which
      # Actions does not put in the job env on its own (see the export step below).
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Secret hygiene check
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '(^|/)ght\.txt$|ARTIFACTS_PASSPHRASE|\.passphrase$|\.keystore$|\.jks$|keystore\.env$|(^|/)key\.properties$' || true)
          if [ -n "$bad" ]; then
            echo "::error::secret material is tracked in this repo: $bad"
            exit 1
          fi
          echo "no secret files tracked"

          # Report where this build will go, at minute one rather than after a 40-minute build.
          # Only the mode is printed, never a value.
          if [ -n "${ARTIFACTS_REPO:-}" ]; then
            echo "publish mode: private artifacts repo"
          elif [ -n "${ARTIFACTS_PASSPHRASE:-}" ]; then
            echo "publish mode: AES-256 encrypted workflow artifact"
          else
            echo "::warning::publish mode: PLAIN public artifact (set ARTIFACTS_REPO or ARTIFACTS_PASSPHRASE)"
          fi

      - name: Checkout upstream RustDesk
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: src
          submodules: recursive

      - name: Apply patches
        run: python3 patches/apply.py src

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Replace Flutter engine with RustDesk's patched engine
        shell: pwsh
        run: |
          $flutterRoot = Split-Path -Parent (Split-Path -Parent (Get-Command flutter).Source)
          Write-Host "flutter root: $flutterRoot"
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $dest = Join-Path $flutterRoot "bin/cache/artifacts/engine/windows-x64-release"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Force -Recurse "windows-x64-release/*" $dest
          if (-not (Test-Path (Join-Path $dest "flutter_windows.dll"))) {
            throw "engine replacement failed, flutter_windows.dll missing in $dest"
          }
          Write-Host "engine replaced in $dest"

      - name: Patch Flutter (dropdown filter)
        shell: bash
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "$GITHUB_WORKSPACE/src/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-x64
          workspaces: src -> target

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        # vcpkg runs in MANIFEST mode: with no package arguments it reads `vcpkg.json` from the
        # current directory, and that file (plus the `res/vcpkg` overlay ports it points at)
        # lives in the RustDesk source tree, not in this builder repo. Wrong cwd => vcpkg prints
        # its usage and exits 1.
        working-directory: src
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          set -euo pipefail
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; tail -n 80 "$f"; done
            exit 1
          fi
          echo "installed:"; ls "$VCPKG_ROOT/installed/x64-windows-static/lib" 2>/dev/null | head -20 || true

      - name: Generate flutter-rust-bridge
        uses: ./.github/actions/gen-bridge

      - name: Build RustDesk
        shell: pwsh
        working-directory: src
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw "build.py failed" }
          Move-Item -Force ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Verify build output
        shell: pwsh
        working-directory: src
        run: |
          if (-not (Test-Path ./rustdesk/rustdesk.exe)) { throw "rustdesk.exe missing" }
          & ./rustdesk/rustdesk.exe --version

      - name: Package
        shell: pwsh
        working-directory: src
        run: |
          Compress-Archive -Path ./rustdesk -DestinationPath "$env:GITHUB_WORKSPACE/rustdesk-${{ env.VERSION }}-windows-x64.zip" -Force

      # Tier 1: private companion repo (recommended, truly access-controlled).
      - name: Publish build to private artifacts repo
        if: ${{ inputs.publish_release != false && env.ARTIFACTS_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ARTIFACTS_REPO is set but ARTIFACTS_TOKEN is empty, so nothing can be published. Add a PAT with Contents: read+write on $ARTIFACTS_REPO."
            exit 1
          fi
          TAG="build-${{ github.run_number }}"
          gh release view "$TAG" --repo "$ARTIFACTS_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$ARTIFACTS_REPO" \
                 --title "RustDesk custom build #${{ github.run_number }}" \
                 --notes "source ${{ github.repository }}@${{ github.sha }}" || true
          gh release upload "$TAG" "rustdesk-${{ env.VERSION }}-windows-x64.zip" \
            --repo "$ARTIFACTS_REPO" --clobber
          echo "published to https://github.com/$ARTIFACTS_REPO/releases/tag/$TAG"

      # Tier 2/3: no private repo, so it has to live in this repo's artifact storage.
      - name: Prepare workflow artifact
        id: artifact
        if: ${{ inputs.publish_release != false && env.ARTIFACTS_REPO == '' }}
        shell: bash
        run: |
          set -euo pipefail
          F="rustdesk-${{ env.VERSION }}-windows-x64.zip"
          if [ -n "${ARTIFACTS_PASSPHRASE:-}" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -md sha256 -salt -in "$F" -out "$F.enc" -pass env:ARTIFACTS_PASSPHRASE
            echo "path=$F.enc" >> "$GITHUB_OUTPUT"
            echo "::notice::Encrypted with AES-256. Decrypt with: openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -in $F.enc -out $F"
          else
            echo "path=$F" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither ARTIFACTS_REPO nor ARTIFACTS_PASSPHRASE is set, so this build is downloadable by anyone with a GitHub account. It will be deleted after 1 day."
          fi

      - name: Upload workflow artifact
        if: ${{ inputs.publish_release != false && env.ARTIFACTS_REPO == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACTS_PASSPHRASE != '' && 3 || 1 }}
